<!DOCTYPE html>
<html>
<head>
<title>DevOps Control Panel</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:linear-gradient(135deg,#020617,#1e293b);
    color:white;
    text-align:center;
}

h1 {
    margin-top:40px;
    color:#22d3ee;
}

.buttons {
    margin:30px;
}

button {
    padding:14px 30px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.start { background:#22c55e; }
.stop { background:#ef4444; }
.restart { background:#3b82f6; }
.deploy { background:#f59e0b; }

button:hover {
    transform:scale(1.1);
}

.logs {
    width:80%;
    height:300px;
    margin:40px auto;
    background:black;
    color:#00ff88;
    padding:20px;
    border-radius:10px;
    text-align:left;
    overflow:auto;
    font-family:monospace;
}
</style>

<script>
function action(cmd){
    fetch("/"+cmd).then(()=>loadLogs());
}

function loadLogs(){
    fetch("/logs")
    .then(res=>res.text())
    .then(data=>{
        document.getElementById("logs").innerText=data;
    });
}

setInterval(loadLogs,2000);
</script>

</head>

<body>

<h1>DevOps Control Panel</h1>

<div class="buttons">
    <button class="start" onclick="action('start')">Start</button>
    <button class="stop" onclick="action('stop')">Stop</button>
    <button class="restart" onclick="action('restart')">Restart</button>
    <button class="deploy" onclick="action('deploy')">Deploy</button>
</div>

<div id="logs" class="logs">System Ready...</div>

</body>
</html>
